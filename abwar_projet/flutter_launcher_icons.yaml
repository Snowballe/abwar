# Configuration des icônes de l'application
# Pour générer de nouvelles icônes, exécutez : flutter pub run flutter_launcher_icons:main

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/icone_abwar.png"
  remove_alpha_ios: true
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/icone_abwar.png"
    background_color: "#1E3A8A"
    theme_color: "#3B82F6"
  windows:
    generate: true
    image_path: "assets/images/icone_abwar.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/images/icone_abwar.png"
